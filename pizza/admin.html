<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rollmi — управление меню</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1428">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="rollmi.css">
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script src="common.js"></script>
<script>
(function(){
"use strict";
var E=PZ.esc,M=PZ.money,R=PZ.REPO,app=document.getElementById("app");
var API="https://api.github.com/repos/"+R.owner+"/"+R.repo+"/contents/";
var token=PZ.lsGet("pz-admin-token")||"";
var D=null,sha=null,saved="",tab="items",q="",fcat="",sheet=null,busy=false,armed=null;
var th=PZ.lsGet("rollmi-theme");if(th)document.documentElement.dataset.theme=th;

/* ---------- GitHub ---------- */
function gh(path,opt){opt=opt||{};opt.headers=Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+token},opt.headers||{});
  return fetch(path.indexOf("http")===0?path:API+path,opt).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.message||("Ошибка "+r.status));e.status=r.status;throw e;}return j;});});}
function b64enc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b64dec(b){var bin=atob(b.replace(/\n/g,"")),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a);}
function fetchMenu(){return gh(R.path+"?ref="+R.branch+"&t="+Date.now()).then(function(j){sha=j.sha;return JSON.parse(b64dec(j.content));});}
function putMenu(retry){
  var body=JSON.stringify(D,null,2)+"\n";
  return gh(R.path,{method:"PUT",body:JSON.stringify({message:"Меню: обновление из админки",content:b64enc(body),sha:sha,branch:R.branch})})
    .then(function(j){sha=j.content.sha;})
    .catch(function(e){if((e.status===409||e.status===422)&&!retry)return gh(R.path+"?ref="+R.branch+"&t="+Date.now()).then(function(j){sha=j.sha;return putMenu(true);});throw e;});}
function uploadImage(file,prefix){
  return new Promise(function(ok,bad){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){var max=1100,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      var full=c.toDataURL("image/jpeg",.82),data=full.split(",")[1],name=prefix+"-"+Date.now().toString(36)+".jpg";
      gh(R.img+name,{method:"PUT",body:JSON.stringify({message:"Фото: "+name,content:data,branch:R.branch})}).then(function(){PZ.prev["img/"+name]=full;ok("img/"+name);}).catch(bad);};
    img.onerror=function(){bad(new Error("Это не картинка"));};img.src=url;});}

/* ---------- состояние ---------- */
function dirty(){return D&&JSON.stringify(D)!==saved;}
function draft(){if(D)PZ.lsSet("pz-admin-draft",JSON.stringify({d:D,base:saved}));}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function cat(id){return D.categories.filter(function(c){return c.id===id;})[0];}
function item(id){return D.items.filter(function(i){return i.id===id;})[0];}
function arm(key,el){if(armed===key){armed=null;return true;}armed=key;el.textContent="Точно?";el.classList.add("danger");setTimeout(function(){if(armed===key){armed=null;render();}},3000);return false;}
window.addEventListener("beforeunload",function(e){if(dirty()){e.preventDefault();e.returnValue="";}});

/* ---------- вход ---------- */
function login(err){
  app.innerHTML='<div class="login"><form id="lf"><div class="logo" style="width:64px;height:64px"><img src="img/logo.jpg" alt=""></div><h1>Вход для владельца</h1><p class="hint" style="margin:0">Здесь меняется меню, цены и описание. Изменения сразу появляются на сайте.</p><div class="f"><label for="tk">Ключ доступа</label><input id="tk" type="password" autocomplete="current-password" placeholder="github_pat_…" required></div>'+(err?'<div class="err-msg">'+E(err)+'</div>':'')+'<button class="btn" type="submit">Войти</button>'+
  '<details class="help"><summary>Где взять ключ?</summary><ol><li>Войдите на github.com в аккаунт, где лежит сайт.</li><li>Откройте: Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li><li>Repository access: <b>Only select repositories</b> → <b>'+E(R.repo)+'</b>.</li><li>Permissions → Repository → <b>Contents: Read and write</b>.</li><li>Скопируйте ключ и вставьте сюда. На этом устройстве он запомнится.</li></ol></details>'+
  '<a class="hint" href="./" style="text-align:center">← Вернуться на сайт</a></form></div>';
  document.getElementById("lf").onsubmit=function(e){e.preventDefault();token=document.getElementById("tk").value.trim();start(true);};}
function start(fresh){
  if(!token){login();return;}
  app.innerHTML='<div class="loading">Проверяем доступ…</div>';
  gh("https://api.github.com/repos/"+R.owner+"/"+R.repo).then(function(r){
    if(!r.permissions||!r.permissions.push)throw new Error("У ключа нет права на запись в репозиторий «"+R.repo+"».");
    PZ.lsSet("pz-admin-token",token);return fetchMenu();
  }).then(function(d){
    D=d;saved=JSON.stringify(d);
    try{var dr=JSON.parse(PZ.lsGet("pz-admin-draft")||"null");if(dr&&dr.base===saved&&JSON.stringify(dr.d)!==saved){D=dr.d;setTimeout(function(){toast("Восстановлены неопубликованные изменения");},300);}}catch(e){}
    render();
  }).catch(function(e){token="";PZ.lsDel("pz-admin-token");login(e.status===401?"Неверный ключ. Проверьте и попробуйте снова.":e.message);});}

/* ---------- экраны ---------- */
function top(){
  return '<div class="adm-top"><div class="wrap"><div class="logo" style="width:40px;height:40px">'+(D.settings.logo?'<img src="'+E(PZ.src(D.settings.logo))+'" alt="">':'<span>R</span>')+'</div><h2>'+E(D.settings.name)+' — меню</h2><a class="ghost" href="./" target="_blank" rel="noopener">Сайт ↗</a><button class="btn" data-pub'+(dirty()&&!busy?'':' disabled')+'>'+(busy?'Сохраняем…':dirty()?'Опубликовать':'Сохранено ✓')+'</button></div><div class="wrap"><div class="tabs">'+
    [["items","Позиции ("+D.items.length+")"],["cats","Категории"],["settings","Настройки"]].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>';}).join("")+'</div></div></div>';}
function itemsTab(){
  var h='<div class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="search" data-q placeholder="Поиск по названию…" value="'+E(q)+'"><select class="search" style="flex:0 1 200px" data-fcat><option value="">Все категории</option>'+D.categories.map(function(c){return '<option value="'+E(c.id)+'"'+(fcat===c.id?' selected':'')+'>'+E(c.name)+'</option>';}).join("")+'</select><button class="btn" data-new>+ Добавить блюдо</button></div></div>';
  D.categories.forEach(function(c){
    if(fcat&&fcat!==c.id)return;
    var list=D.items.filter(function(i){return i.cat===c.id&&(!q||i.name.toLowerCase().indexOf(q.toLowerCase())>=0);});
    if(q&&!list.length)return;
    h+='<div class="panel"><h4>'+E(c.name)+' · '+list.length+'</h4>'+(list.length?'':'<p class="hint">Пусто. Нажмите «Добавить блюдо».</p>')+list.map(function(it){
      return '<div class="ai'+(it.hidden?' off':'')+'"><div class="th">'+PZ.pic(it)+'</div><div class="t"><div>'+E(it.name)+(it.hidden?' · скрыто':'')+(it.badge?' · '+E(it.badge):'')+'</div><div>'+M(it.price)+(+it.old?' <s>'+M(it.old)+'</s>':'')+(it.weight?' · '+E(it.weight):'')+'</div></div><div class="acts"><button class="mini" data-up="'+it.id+'" aria-label="Выше">↑</button><button class="mini" data-down="'+it.id+'" aria-label="Ниже">↓</button><button class="mini" data-hide="'+it.id+'">'+(it.hidden?'Показать':'Скрыть')+'</button><button class="mini" data-edit="'+it.id+'">Изменить</button><button class="mini danger" data-del="'+it.id+'">Удалить</button></div></div>';}).join("")+'</div>';});
  var orphan=D.items.filter(function(i){return !cat(i.cat);});
  if(orphan.length)h+='<div class="banner">Есть позиции без категории ('+orphan.length+'): '+orphan.map(function(i){return E(i.name);}).join(", ")+'. Откройте их и выберите категорию.</div>';
  return h;}
function catsTab(){
  return '<div class="panel"><h4>Категории меню</h4><p class="hint">Порядок здесь = порядок на сайте. Удалить можно только пустую категорию.</p>'+D.categories.map(function(c){var n=D.items.filter(function(i){return i.cat===c.id;}).length;
    return '<div class="ai"><div class="t f" style="min-width:160px"><input data-cname="'+E(c.id)+'" value="'+E(c.name)+'" aria-label="Название категории"></div><span class="hint">'+n+' поз.</span><div class="acts"><button class="mini" data-cup="'+E(c.id)+'">↑</button><button class="mini" data-cdown="'+E(c.id)+'">↓</button><button class="mini danger" data-cdel="'+E(c.id)+'">Удалить</button></div></div>';}).join("")+
    '<div style="display:flex;gap:8px"><input class="search" id="newcat" placeholder="Новая категория, например «Десерты»"><button class="btn" data-addcat>Добавить</button></div></div>';}
function sf(k,label,type,ph){var v=D.settings[k];return '<div class="f"><label>'+label+'</label><input data-s="'+k+'" type="'+(type||"text")+'" value="'+E(v==null?"":v)+'" placeholder="'+E(ph||"")+'"'+(type==="number"?' inputmode="numeric" min="0"':'')+'></div>';}
function photoField(k,label){var v=D.settings[k];return '<div class="f"><label>'+label+'</label><div class="photo"><div class="th" style="'+(k==="logo"?'width:75px;border-radius:50%':'')+'">'+(v?'<img src="'+E(PZ.src(v))+'" alt="">':'<div class="hint" style="display:grid;place-items:center;height:100%">нет</div>')+'</div><label class="ghost" style="cursor:pointer">Загрузить<input type="file" accept="image/*" data-simg="'+k+'" hidden></label>'+(v?'<button class="mini danger" data-sclear="'+k+'">Убрать</button>':'')+'</div></div>';}
function settingsTab(){var s=D.settings;
  return '<div class="panel"><h4>Основное</h4><div class="two">'+sf("name","Название пиццерии")+sf("slogan","Слоган")+sf("city","Город")+sf("address","Адрес (для самовывоза)")+'</div>'+photoField("logo","Логотип")+photoField("hero","Фото на главной (фон шапки)")+'</div>'+
  '<div class="panel"><h4>Связь</h4><div class="two">'+sf("whatsapp","WhatsApp для заказов","tel","+7 7__ ___ __ __")+sf("instagram","Instagram (без @)")+'</div><p class="hint">Все заказы приходят на этот номер WhatsApp.</p></div>'+
  '<div class="panel"><h4>Работа и доставка</h4><div class="two">'+sf("open","Открытие","time")+sf("close","Закрытие","time")+sf("deliveryFee","Цена доставки, ₸","number")+sf("freeFrom","Бесплатная доставка от, ₸ (0 — нет)","number")+sf("minOrder","Минимальный заказ, ₸ (0 — нет)","number")+'</div><label class="check"><input type="checkbox" data-s="pickup"'+(s.pickup?' checked':'')+'> Есть самовывоз</label>'+
  '<div class="f"><label>Объявление на главной</label><textarea data-s="notice">'+E(s.notice||"")+'</textarea></div></div>'+
  '<div class="panel"><h4>Устройство</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" data-theme>Сменить тему</button><button class="ghost danger" data-logout>Выйти</button></div></div>';}
function sheetHTML(){if(!sheet)return "";var it=sheet;
  var badges=["","Хит","Новинка","Выгодно","Острый"];
  return '<div class="sheet-scrim" data-close-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="sh-head"><h3>'+(item(it.id)?'Изменить':'Новое блюдо')+'</h3><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>'+
  '<div class="f"><label>Название *</label><input data-e="name" value="'+E(it.name)+'" placeholder="Например: Филадельфия"></div>'+
  '<div class="f"><label>Категория</label><select data-e="cat">'+D.categories.map(function(c){return '<option value="'+E(c.id)+'"'+(it.cat===c.id?' selected':'')+'>'+E(c.name)+'</option>';}).join("")+'</select></div>'+
  '<div class="two"><div class="f"><label>Цена, ₸ *</label><input data-e="price" type="number" inputmode="numeric" min="0" value="'+(it.price===""||it.price==null?"":+it.price)+'"></div><div class="f"><label>Старая цена, ₸ (для скидки)</label><input data-e="old" type="number" inputmode="numeric" min="0" value="'+(+it.old||"")+'"></div></div>'+
  '<div class="two"><div class="f"><label>Размер / вес</label><input data-e="weight" value="'+E(it.weight)+'" placeholder="36 шт, 30 см, 1 шт"></div><div class="f"><label>Наклейка</label><select data-e="badge">'+badges.map(function(b){return '<option value="'+b+'"'+((it.badge||"")===b?' selected':'')+'>'+(b||"— нет —")+'</option>';}).join("")+(badges.indexOf(it.badge||"")<0?'<option selected value="'+E(it.badge)+'">'+E(it.badge)+'</option>':'')+'</select></div></div>'+
  '<div class="f"><label>Описание / состав</label><textarea data-e="desc" placeholder="Рис, нори, сыр, лосось…">'+E(it.desc)+'</textarea></div>'+
  '<div class="f"><label>Фото</label><div class="photo"><div class="th">'+PZ.pic(it)+'</div><label class="ghost" style="cursor:pointer">'+(it.img?'Заменить':'Загрузить фото')+'<input type="file" accept="image/*" data-eimg hidden></label>'+(it.img?'<button class="mini danger" data-eclear>Убрать</button>':'')+'</div><p class="hint" style="margin:4px 0 0">Без фото позиция показывается компактной строкой с рисунком. С фото — большой карточкой.</p></div>'+
  '<label class="check"><input type="checkbox" data-e="hidden"'+(it.hidden?' checked':'')+'> Скрыть с сайта (например, закончилось)</label>'+
  '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" data-close>Отмена</button><button class="btn" data-save>Готово</button></div><p class="hint" style="margin:0">После «Готово» нажмите <b>«Опубликовать»</b> сверху — тогда изменения появятся на сайте.</p></div></div>';}
function render(){
  if(!D)return;var y=window.scrollY,focusId=document.activeElement&&document.activeElement.dataset&&(document.activeElement.dataset.q!==undefined?"q":null);
  PZ.setCats(D.categories);app.innerHTML='<div class="adm">'+top()+'<main class="wrap adm-body">'+(dirty()?'<div class="banner">Есть неопубликованные изменения. Нажмите «Опубликовать», чтобы их увидели клиенты.</div>':'')+(tab==="items"?itemsTab():tab==="cats"?catsTab():settingsTab())+'</main></div>'+sheetHTML();
  window.scrollTo(0,y);
  if(focusId==="q"){var el=document.querySelector("[data-q]");el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
function changed(){draft();var b=document.querySelector("[data-pub]");if(b){b.disabled=!dirty()||busy;b.textContent=busy?'Сохраняем…':dirty()?'Опубликовать':'Сохранено ✓';}
  var main=document.querySelector(".adm-body"),bn=main&&main.querySelector(":scope>.banner:first-child");
  if(main&&dirty()&&!bn)main.insertAdjacentHTML("afterbegin",'<div class="banner">Есть неопубликованные изменения. Нажмите «Опубликовать», чтобы их увидели клиенты.</div>');
  if(bn&&!dirty())bn.remove();}
function move(arr,idx,dir,same){var j=idx+dir;while(j>=0&&j<arr.length&&same&&!same(arr[j]))j+=dir;if(j<0||j>=arr.length)return;var t=arr[idx];arr[idx]=arr[j];arr[j]=t;}

/* ---------- действия ---------- */
function publish(){
  if(busy||!dirty())return;
  var bad=D.items.filter(function(i){return !i.hidden&&(!i.name.trim()||(i.price===""||!(+i.price>=0)));});
  if(bad.length){toast("Проверьте название и цену: "+bad.map(function(i){return i.name||"без названия";}).join(", "));return;}
  busy=true;changed();
  putMenu().then(function(){saved=JSON.stringify(D);PZ.lsDel("pz-admin-draft");busy=false;render();toast("Опубликовано! На сайте обновится через 1–2 минуты.");})
  .catch(function(e){busy=false;render();toast(e.status===401?"Ключ больше не действует — войдите заново":"Не сохранилось: "+e.message);});}

app.addEventListener("click",function(e){
  var t=e.target.closest("button,[data-close-scrim]");if(!t)return;var d=t.dataset;
  if("closeScrim" in d){if(e.target===t){sheet=null;render();}return;}
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);}
  else if("pub" in d)publish();
  else if("new" in d){sheet={id:uid("i"),cat:fcat||(D.categories[0]&&D.categories[0].id)||"",name:"",desc:"",price:"",old:0,weight:"",img:"",badge:"",hidden:false};render();}
  else if(d.edit){sheet=JSON.parse(JSON.stringify(item(d.edit)));render();}
  else if(d.hide){var it=item(d.hide);it.hidden=!it.hidden;render();draft();}
  else if(d.del){if(!arm("del"+d.del,t))return;D.items=D.items.filter(function(i){return i.id!==d.del;});render();draft();toast("Удалено. Нажмите «Опубликовать»");}
  else if(d.up||d.down){var id=d.up||d.down,i=D.items.indexOf(item(id)),c=item(id).cat;move(D.items,i,d.up?-1:1,function(x){return x.cat===c;});render();draft();}
  else if(d.cup||d.cdown){var ci=D.categories.indexOf(cat(d.cup||d.cdown));move(D.categories,ci,d.cup?-1:1);render();draft();}
  else if(d.cdel){var n=D.items.filter(function(i){return i.cat===d.cdel;}).length;if(n){toast("Сначала перенесите или удалите позиции ("+n+")");return;}if(!arm("c"+d.cdel,t))return;D.categories=D.categories.filter(function(c){return c.id!==d.cdel;});render();draft();}
  else if("addcat" in d){var inp=document.getElementById("newcat"),nm=inp.value.trim();if(!nm){inp.focus();return;}D.categories.push({id:uid("c"),name:nm});render();draft();}
  else if("close" in d){sheet=null;render();}
  else if("save" in d){if(!sheet.name.trim()){toast("Введите название");return;}if(sheet.price===""||sheet.price==null||!(+sheet.price>=0)){toast("Введите цену (для бесплатного — 0)");return;}
    sheet.price=Math.round(+sheet.price);sheet.old=Math.round(+sheet.old)||0;var ex=item(sheet.id);
    if(ex)D.items[D.items.indexOf(ex)]=sheet;else D.items.push(sheet);sheet=null;render();draft();toast("Готово. Не забудьте «Опубликовать»");}
  else if("eclear" in d){sheet.img="";render();}
  else if(d.sclear){D.settings[d.sclear]="";render();draft();}
  else if("theme" in d){var r=document.documentElement,nt=r.dataset.theme==="light"?"dark":"light";r.dataset.theme=nt;PZ.lsSet("rollmi-theme",nt);}
  else if("logout" in d){if(dirty()&&!arm("logout",t))return;PZ.lsDel("pz-admin-token");PZ.lsDel("pz-admin-draft");token="";D=null;login();}
});
app.addEventListener("input",function(e){var t=e.target,d=t.dataset;
  if(d.q!==undefined){q=t.value;render();return;}
  if(d.e&&sheet){sheet[d.e]=t.type==="checkbox"?t.checked:t.value;return;}
  if(d.s){var v=t.type==="checkbox"?t.checked:t.type==="number"?(+t.value||0):t.value;D.settings[d.s]=v;changed();return;}
  if(d.cname){cat(d.cname).name=t.value;changed();}
});
app.addEventListener("change",function(e){var t=e.target,d=t.dataset;
  if(d.fcat!==undefined){fcat=t.value;render();return;}
  if(d.e&&sheet&&t.tagName==="SELECT"){sheet[d.e]=t.value;return;}
  if(d.s&&t.type==="checkbox"){D.settings[d.s]=t.checked;changed();return;}
  if((d.eimg!==undefined||d.simg)&&t.files&&t.files[0]){
    var lab=t.parentNode;lab.firstChild.textContent="Загружаем…";
    uploadImage(t.files[0],d.simg||(sheet&&sheet.id)||"img").then(function(path){
      if(d.simg){D.settings[d.simg]=path;draft();}else if(sheet)sheet.img=path;render();toast("Фото загружено");
    }).catch(function(err){render();toast("Фото не загрузилось: "+err.message);});}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet){sheet=null;render();}});

start();
})();
</script>
</body>
</html>
